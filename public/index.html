<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Stateful Login</title>
    <script src="tailwind.min.js"></script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans"
  >
    <div
      class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center"
    >
      <h1 class="text-2xl font-bold mb-2 font-mono text-cyan-400">
        Stateful Dev Suite
      </h1>
      <p class="text-xs text-slate-400 mb-6">
        Learn traditional stateful cookie sessions
      </p>

      <div class="flex justify-center mb-6">
        <button
          onclick="launchFacebookLogin()"
          class="bg-[#1877F2] hover:bg-[#166FE5] text-white px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-3 transition shadow-lg"
        >
          Continue with Facebook
        </button>
      </div>

      <div
        id="profile-card"
        class="hidden border-t border-slate-800 pt-6 mt-4 text-left"
      >
        <div class="flex items-center gap-4 mb-4">
          <img
            id="user-avatar"
            class="w-12 h-12 rounded-full border border-cyan-500/30"
            src=""
            alt="Avatar"
          />
          <div>
            <h2
              id="user-name"
              class="text-sm font-bold font-mono text-slate-200"
            ></h2>
            <p id="user-email" class="text-xs text-slate-500"></p>
          </div>
        </div>
        <button
          onclick="logout()"
          class="w-full bg-rose-500/10 active:bg-rose-500 text-rose-400 border border-rose-500/20 active:text-white py-2 rounded-xl text-xs font-bold font-mono transition"
        >
          Logout Session Key
        </button>
      </div>
    </div>

    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "842554538906409",
          cookie: true,
          xfbml: true,
          version: "v19.0",
        });
      };

      (function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "facebook-jssdk");

      function launchFacebookLogin() {
        FB.login(
          function (response) {
            if (response.authResponse) {
              handleFacebookResponse(response.authResponse.accessToken);
            }
          },
          { scope: "" },
        );
      }

      async function handleFacebookResponse(fbAccessToken) {
        const res = await fetch("/api/auth/facebook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: fbAccessToken }),
        });

        if (res.ok) {
          await fetchUserProfile();
        }
      }

      fetchUserProfile();

      async function fetchUserProfile() {
        const res = await fetch("/api/users/profile");
        const result = await res.json();

        if (result.status === "success") {
          document.getElementById("user-avatar").src =
            result.data.avatarUrl || "https://avatar.iran.liara.run/public";
          document.getElementById("user-name").innerText =
            `${result.data.firstName} ${result.data.lastName || ""}`;
          document.getElementById("user-email").innerText =
            result.data.email || "No email profile (Phone Registration)";
          document.getElementById("profile-card").classList.remove("hidden");
        }
      }

      async function logout() {
        try {
          // Send request to server to destroy database row and cache footprint
          const res = await fetch("/api/auth/logout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
          });

          if (!res.ok) {
            console.warn(
              "Server side session cleanup encountered non-200 state.",
            );
          }
        } catch (err) {
          console.error(
            "Network communication breakdown during logout sequence:",
            err,
          );
        } finally {
          window.location.reload();
        }
      }
    </script>
  </body>
</html>
