<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Passwordless Login</title>
    <script src="tailwind.min.js"></script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans"
  >
    <div
      class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center"
    >
      <h1 class="text-2xl font-bold mb-2 font-mono text-cyan-400">
        Passwordless Dev Suite
      </h1>
      <p class="text-xs text-slate-400 mb-6">
        Learn secure Google sign-ins natively
      </p>

      <div class="flex justify-center mb-6">
        <div
          id="g_id_onload"
          data-client_id="669117862294-08k4bvivc487ktqo5916fild1rr4cgkh.apps.googleusercontent.com"
          data-callback="handleCredentialResponse"
          data-auto_prompt="false"
        ></div>
        <div
          class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-theme="dark"
          data-text="continue_with"
          data-shape="rectangular"
          data-logo_alignment="left"
        ></div>
      </div>

      <div
        id="profile-card"
        class="hidden border-t border-slate-800 pt-6 mt-4 text-left"
      >
        <div class="flex items-center gap-4 mb-4">
          <img
            id="user-avatar"
            class="w-12 h-12 rounded-full border border-cyan-500/30"
            src=""
            alt="Avatar"
          />
          <div>
            <h2
              id="user-name"
              class="text-sm font-bold font-mono text-slate-200"
            ></h2>
            <p id="user-email" class="text-xs text-slate-500"></p>
          </div>
        </div>
        <button
          onclick="logout()"
          class="w-full bg-rose-500/10 active:bg-rose-500 text-rose-400 border border-rose-500/20 active:text-white py-2 rounded-xl text-xs font-bold font-mono transition"
        >
          Logout Session Key
        </button>
      </div>
    </div>

    <script
      src="https://accounts.google.com/gsi/client?hl=en"
      async
      defer
    ></script>

    <script>
      let localAccessToken = "";

      async function handleCredentialResponse(response) {
        // 🚀 Receive cryptographic credential string directly from Google authentication overlay
        const idToken = response.credential;

        const res = await fetch("/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: idToken }),
        });

        const data = await res.json();
        if (data.status === "success") {
          localAccessToken = data.accessToken;
          await fetchUserProfile();
        }
      }

      async function fetchUserProfile() {
        const res = await fetch("/api/users/profile", {
          headers: { Authorization: `Bearer ${localAccessToken}` },
        });
        const result = await res.json();

        if (result.status === "success") {
          document.getElementById("user-avatar").src =
            result.data.avatarUrl || "https://avatar.iran.liara.run/public";
          document.getElementById("user-name").innerText =
            `${result.data.firstName} ${result.data.lastName || ""}`;
          document.getElementById("user-email").innerText = result.data.email;
          document.getElementById("profile-card").classList.remove("hidden");
        }
      }

      function logout() {
        localAccessToken = "";
        document.getElementById("profile-card").classList.add("hidden");
        window.location.reload();
      }
    </script>
  </body>
</html>
